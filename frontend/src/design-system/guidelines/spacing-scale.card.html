<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px 베이스 그리드" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:20px;font-family:var(--font-numeric);color:var(--text-secondary);font-size:11px;}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bar{background:var(--accent);height:10px;}
</style></head>
<body data-theme="dark">
<div class="row"><div style="width:40px;">4</div><div class="bar" style="width:var(--space-1);"></div></div>
<div class="row"><div style="width:40px;">8</div><div class="bar" style="width:var(--space-2);"></div></div>
<div class="row"><div style="width:40px;">12</div><div class="bar" style="width:var(--space-3);"></div></div>
<div class="row"><div style="width:40px;">16</div><div class="bar" style="width:var(--space-4);"></div></div>
<div class="row"><div style="width:40px;">24</div><div class="bar" style="width:var(--space-6);"></div></div>
<div class="row"><div style="width:40px;">32</div><div class="bar" style="width:var(--space-8);"></div></div>
<div class="row"><div style="width:40px;">48</div><div class="bar" style="width:var(--space-12);"></div></div>
</body></html>
