<!-- @dsCard group="Brand" viewport="700x150" name="Radius Scale" subtitle="4px(md)가 카드/버튼 기본값으로 확정" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:20px;font-family:var(--font-body);display:flex;gap:16px;}
.box{width:100px;height:70px;background:var(--bg-surface);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary);}
</style></head>
<body data-theme="dark">
<div class="box" style="border-radius:var(--radius-xs);">xs 2px</div>
<div class="box" style="border-radius:var(--radius-sm);">sm 3px</div>
<div class="box" style="border-radius:var(--radius-md);outline:2px solid var(--accent);outline-offset:2px;">md 4px ✓</div>
<div class="box" style="border-radius:var(--radius-lg);">lg 6px</div>
</body></html>
