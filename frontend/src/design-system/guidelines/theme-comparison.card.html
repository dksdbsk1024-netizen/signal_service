<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;display:flex;font-family:var(--font-body);}
.half{flex:1;padding:20px;}
</style></head>
<body>
<div class="half" data-theme="dark" style="background:var(--bg-base);">
  <div style="color:var(--text-primary);font-weight:700;font-size:14px;">다크 (기본)</div>
  <div class="ds-numeric" style="color:var(--signal-buy);font-size:24px;font-weight:900;margin-top:8px;">+1.8%</div>

<div class="half" data-theme="light" style="background:var(--bg-base);">
  <div style="color:var(--text-primary);font-weight:700;font-size:14px;">라이트</div>
  <div class="ds-numeric" style="color:var(--signal-buy);font-size:24px;font-weight:900;margin-top:8px;">+1.8%</div>
  <div style="color:var(--text-tertiary);font-size:11px;margin-top:4px;">밝은 환경 · 인쇄/공유용</div>
