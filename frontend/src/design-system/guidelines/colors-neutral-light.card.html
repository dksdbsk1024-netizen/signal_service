<!-- @dsCard group="Colors" viewport="700x150" name="Neutral Scale (Light)" subtitle="라이트 모드 대응 스케일" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg-base);padding:16px;font-family:var(--font-body);}
.strip{display:flex;}
.sw{flex:1;height:70px;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#5b6672;font-family:var(--font-numeric);border:1px solid #e5e7eb;box-sizing:border-box;}
</style></head>
<body data-theme="light">
<div class="strip">
  <div class="sw" style="background:var(--n-1);">n-1</div>
  <div class="sw" style="background:var(--n-2);">n-2</div>
  <div class="sw" style="background:var(--n-3);">n-3</div>
  <div class="sw" style="background:var(--n-4);">n-4</div>
  <div class="sw" style="background:var(--n-5);">n-5</div>
  <div class="sw" style="background:var(--n-6);">n-6</div>
  <div class="sw" style="background:var(--n-7);">n-7</div>
  <div class="sw" style="background:var(--n-8);color:#fff;">n-8</div>
  <div class="sw" style="background:var(--n-9);color:#fff;">n-9</div>
  <div class="sw" style="background:var(--n-10);color:#fff;">n-10</div>
  <div class="sw" style="background:var(--n-11);color:#fff;">n-11</div>
</div>
</body></html>
