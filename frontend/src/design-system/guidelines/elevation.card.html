<!-- @dsCard group="Brand" viewport="700x180" name="Card Elevation" subtitle="미세한 elevation — 그림자 최소, 보더 위주" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:20px;font-family:var(--font-body);display:flex;gap:16px;color:var(--text-secondary);font-size:12px;}
.card{width:150px;height:110px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px;background:var(--bg-surface);border:1px solid var(--border-default);}
</style></head>
<body data-theme="dark">
<div class="card" style="box-shadow:var(--shadow-xs);">shadow-xs</div>
<div class="card" style="box-shadow:var(--shadow-sm);">shadow-sm</div>
<div class="card" style="box-shadow:var(--shadow-md);">shadow-md</div>
<div class="card" style="background:var(--bg-surface-raised);">surface-raised (호버)</div>
</body></html>
